name: Gacha Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/paimon-moe-local-data.json'
      - 'data/starrailstation-backup_*.dat'
      - 'pipeline/**'
      - 'tests/**'
      - 'dashboard.py'
      - 'requirements*.txt'
      - 'runtime.txt'
      - '.github/workflows/cml.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wish-pipeline-main
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # Optional repository variable (Settings > Secrets and variables > Actions > Variables):
      # set GACHA_MASK_UID to 1 to mask the Genshin UID in data/data_clean_gi.csv (887284572 -> 88xxxxx72).
      GACHA_MASK_UID: ${{ vars.GACHA_MASK_UID }}
    steps:
      # Actions are pinned to a commit SHA (the comment is the tag). Update the SHA by hand to upgrade.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'runtime.txt'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Unit tests first: a broken decoder / parser / Luck Score stops the run before any data is touched.
      - name: Run tests
        run: python -m pytest -q

      # fetch lookups -> preprocess -> analytics, for every game whose export is in data/
      #   Genshin Impact   : data/paimon-moe-local-data.json
      #   Honkai: Star Rail: data/starrailstation-backup_YYYY-MM-DD.dat
      # The runner detects the games itself and fails with "No export found" if there is none.
      # A rejected lookup download keeps the existing file. Google Sheets sync is a separate step below.
      - name: Run pipeline
        run: python -m pipeline all --no-sync

      # Renders the whole dashboard headlessly (both game sections) and fails the step on any
      # exception (see tests/smoke_dashboard.py). Non-blocking: data is still committed below.
      - name: Smoke-test dashboard
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/smoke_dashboard.py

      # Fails the run if the push does not succeed, so a missing update never looks green.
      - name: Commit regenerated data & outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data_clean.csv was renamed to data_clean_gi.csv: drop the old file if it is still tracked
          git rm -q --ignore-unmatch data/data_clean.csv
          for f in \
            data/char_full.json data/weapon_full.json data/data_clean_gi.csv \
            data/hsr_char_full.json data/hsr_lc_full.json data/data_clean_hsr.csv \
            outputs; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "chore: auto-update pipeline outputs [skip ci]"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::Could not push the regenerated data after 3 attempts"
          exit 1

      # Optional: only runs when both repo secrets exist (Settings > Secrets and
      # variables > Actions): GSHEET_ID and GCP_SERVICE_ACCOUNT_JSON (the full
      # service-account JSON key, read straight from the environment, no key file).
      # Runs after the commit and continue-on-error, so a Google/API problem never delays or
      # blocks the data update. Creates/updates one tab per account: "GI - <uid>" and "HSR - <account>".
      # `pipeline all` would also work, but the data is already committed, so only sync runs here.
      - name: Sync to Google Sheets
        continue-on-error: true
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSHEET_ID" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Google Sheets secrets not set - skipping sync"
            exit 0
          fi
          python -m pipeline sync

      - name: Build and post report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}"
          BLOB="https://github.com/${{ github.repository }}/blob/${SHA}"
          # raw.githubusercontent.com images do not load for private repositories: link to the file instead
          PRIVATE="${{ github.event.repository.private }}"
          # games = the folders under outputs/ (gi, hsr)
          GAMES=$(find outputs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort | paste -sd, -)
          {
            echo "## 📊 Gacha Analytics Report"
            echo "Generated on \`$(date -u +'%Y-%m-%d %H:%M UTC')\` · games: ${GAMES:-none}"
            echo

            # outputs/gi/ and outputs/hsr/ (one folder per game)
            find outputs -type f -name '*.csv' 2>/dev/null | sort | while IFS= read -r csv; do
              echo "### ${csv#outputs/}"
              echo '```'
              head -n 15 "$csv" | column -s, -t
              echo '```'
              echo
            done

            find outputs -type f -name '*.png' 2>/dev/null | sort | while IFS= read -r png; do
              echo "### ${png#outputs/}"
              if [ "$PRIVATE" = "false" ]; then
                echo "![${png#outputs/}](${RAW}/${png})"
              else
                echo "[${png#outputs/}](${BLOB}/${png})"
              fi
              echo
            done
          } > report.md

          # GitHub comment body limit is 65,536 chars
          head -c 60000 report.md > report_trimmed.md

          gh api "repos/${{ github.repository }}/commits/${SHA}/comments" -F body=@report_trimmed.md
