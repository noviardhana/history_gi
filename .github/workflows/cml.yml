name: Wish Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/paimon-moe-local-data.json'
      - '.github/workflows/cml.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wish-pipeline-main
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: 'runtime.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rarity lookup (always overwrite)
        run: python 00_fetch_rarity_lookup.py

      - name: Check paimon-moe export exists
        run: |
          if [ ! -f "data/paimon-moe-local-data.json" ]; then
            echo "::error::error please get your json file from paimon moe"
            exit 1
          fi

      - name: Run preprocessing
        run: python 01_preprocessing.py

      # Optional: only runs when both repo secrets exist (Settings > Secrets and
      # variables > Actions): GSHEET_ID and GCP_SERVICE_ACCOUNT_JSON (the full
      # service-account JSON key). continue-on-error so a Google/API problem
      # never blocks committing the regenerated data & outputs below.
      - name: Sync to Google Sheets
        continue-on-error: true
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSHEET_ID" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Google Sheets secrets not set - skipping sync"
            exit 0
          fi
          pip install --quiet gspread
          KEY="$RUNNER_TEMP/gcp_sa.json"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$KEY")
          GOOGLE_APPLICATION_CREDENTIALS="$KEY" python 04_sync_gsheet.py

      - name: Run analytics
        run: python 02_analytics.py

      - name: Smoke-test dashboard
        run: |
          pip install --quiet streamlit
          streamlit run 03_dashboard.py --server.headless true --server.port 8501 &
          DASH_PID=$!
          sleep 10
          if curl -sf http://localhost:8501 > /dev/null; then
            echo "Dashboard started OK"
          else
            echo "::warning::Dashboard failed to start"
          fi
          kill $DASH_PID 2>/dev/null || true

      - name: Commit regenerated data & outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/char_full.json data/weapon_full.json data/data_clean.csv outputs/
          git diff --cached --quiet || git commit -m "chore: auto-update pipeline outputs [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Build report
        run: |
          SHA=$(git rev-parse HEAD)
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}"
          {
            echo "## 📊 Wish Analytics Report"
            echo "Generated on \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
            echo

            for csv in outputs/*.csv; do
              [ -e "$csv" ] || continue
              echo "### $(basename "$csv")"
              echo '```'
              head -n 15 "$csv" | column -s, -t
              echo '```'
              echo
            done

            for png in outputs/*.png; do
              [ -e "$png" ] || continue
              echo "### $(basename "$png")"
              echo "![$(basename "$png")](${RAW}/${png})"
              echo
            done
          } > report.md

          # GitHub comment body limit is 65,536 chars
          head -c 60000 report.md > report_trimmed.md

      - name: Post report as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/comments" \
            -F body=@report_trimmed.md